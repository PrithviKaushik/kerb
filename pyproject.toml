[project]
name = "kerb"
version = "0.1.0"
description = "Kerb perception workstream"
requires-python = ">=3.14,<3.15"
dependencies = [
    "torch",
    "torchvision",
    "ultralytics==8.4.99",
    "lap>=0.5.12",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
